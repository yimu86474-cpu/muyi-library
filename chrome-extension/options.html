<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>木易素材库收集器设置</title>
    <style>
      body { margin: 0; color: #2d2932; background: #f5f3f7; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
      main { width: min(620px, calc(100% - 40px)); margin: 70px auto; padding: 35px; border: 1px solid #e3dee8; border-radius: 18px; background: white; box-shadow: 0 18px 60px #2d223010; }
      h1 { margin: 0; font-size: 24px; } p { color: #7b7580; font-size: 13px; line-height: 1.7; }
      label { display: block; margin-top: 28px; font-size: 12px; font-weight: 600; }
      input { width: 100%; margin-top: 8px; padding: 12px; box-sizing: border-box; border: 1px solid #dcd5e2; border-radius: 9px; outline: none; }
      button { margin-top: 12px; padding: 11px 18px; color: white; border: 0; border-radius: 9px; background: #6747d6; cursor: pointer; }
      #status { min-height: 20px; color: #2b9066; }
      code { padding: 2px 5px; border-radius: 4px; background: #eeeaf2; }
    </style>
  </head>
  <body>
    <main>
      <h1>木易素材库收集器</h1>
      <p>打开木易素材库，在「来源与设置 → 浏览器点选收集」复制配对令牌。</p>
      <p id="worker-status">正在唤醒并检查插件……</p>
      <label>配对令牌<input id="token" type="password" autocomplete="off" placeholder="粘贴素材库里的配对令牌" /></label>
      <button id="save">保存并检查连接</button>
      <button id="reload-extension" type="button">重新加载插件</button>
      <p id="status"></p>
      <p>按住 Windows 的 <strong>Alt</strong> 或 macOS 的 <strong>Option</strong>，再左键点击要收集的图片或视频。点扩展图标也可进入点选模式。</p>
      <p>扩展只把你点选的作品资料提交到本机素材库。媒体地址过期时，打开原作品并播放，再点选一次即可更新卡片。</p>
      <p>Chrome 扩展页显示 <code>Service Worker（无效）</code> 时，通常只是表示它在空闲休眠；点选素材或打开本设置页会自动唤醒。如果项目文件刚更新，点上方“重新加载插件”即可，不用再回扩展管理页。</p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
